name: Deploy to GitHub Pages

# main への push で静的サイト（リポジトリのルート）を GitHub Pages へ公開します。
# 事前に一度だけ、リポジトリの Settings → Pages → Source を「GitHub Actions」に設定してください。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を1つに制限（実行中のデプロイはキャンセルしない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Pages 未設定でもワークフロー側で自動的に有効化する（Source=GitHub Actions）
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # リポジトリのルート（index.html がある場所）を公開
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Bing/Yandex等へ更新を通知（IndexNow・無料）。キーは公開前提の値で、ルートの 922d0eaa9c2bf01b7b941e0557f9cb92.txt と一致させる。
      # 失敗してもデプロイは成功扱いにする。
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          urls = re.findall(r"<loc>(.*?)</loc>", open("sitemap.xml", encoding="utf-8").read())
          body = json.dumps({"host": "kakei-hokenshitsu.com", "key": "922d0eaa9c2bf01b7b941e0557f9cb92",
                             "keyLocation": "https://kakei-hokenshitsu.com/922d0eaa9c2bf01b7b941e0557f9cb92.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          print(len(urls), "urls ->", urllib.request.urlopen(req, timeout=30).status)
          PY
