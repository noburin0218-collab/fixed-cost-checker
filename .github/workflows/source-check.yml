name: Source Check

# 記事が出典に挙げている公式ページを、外部へ通信できる GitHub Actions 上で取得して確認する。
# - 週1回：出典リンクがすべて開けるか（404/410 なら失敗にする）
# - 手動実行で urls を渡す：そのページの本文テキストをジョブログに出す（記事の記載との照合用）
# 結果はジョブログにだけ残し、リポジトリへは何も書き込まない。
on:
  schedule:
    - cron: "17 21 * * 0" # 毎週月曜 6:17（日本時間）
  workflow_dispatch:
    inputs:
      urls:
        description: "本文を確認したいURL（スペース区切り）。空なら出典リンクの一括チェック"
        required: false
        default: ""
      grep:
        description: "本文のうち、この正規表現に合う行だけを出す（大きな表の照合用。空なら全文）"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check cited sources
        if: ${{ inputs.urls == '' || inputs.urls == null }}
        run: python3 tools/check-sources.py
      - name: Install PDF / Excel readers
        if: ${{ inputs.urls != '' && inputs.urls != null }}
        # 官公庁の統計・資料は PDF や Excel が多いため、本文を文字として取り出す
        run: python3 -m pip install --quiet "pypdf[crypto]==5.1.0" openpyxl==3.1.5
      - name: Print page text
        if: ${{ inputs.urls != '' && inputs.urls != null }}
        env:
          URLS: ${{ inputs.urls }}
          GREP: ${{ inputs.grep }}
        # URLS は環境変数で渡し、シェルに直接展開しない
        run: |
          read -r -a list <<< "$URLS"
          if [ -n "$GREP" ]; then
            python3 tools/check-sources.py --grep "$GREP" --text "${list[@]}"
          else
            python3 tools/check-sources.py --text "${list[@]}"
          fi
