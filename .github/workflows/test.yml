name: Test

# 依存ゼロ。診断ロジックの単体テストと構文チェックを実行する。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Type check
        run: npm run typecheck
      - name: Unit & DOM tests
        run: npm test

      # 公開前チェック（tools/audit-site.py）。
      # ASP発行コードの原文一致・記事の一次情報・広告表示・canonical・
      # 内部リンク切れ・sitemap との一致を機械的に検証する。
      # 人の記憶に頼らず、変更のたびに必ず走らせる。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Site audit (ASP code / 一次情報 / 広告 / SEO)
        run: python3 tools/audit-site.py
