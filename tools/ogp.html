<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<!--
  OGP画像（1200×630）の元データ。
  SNSで共有したときに表示される画像です。サイト本体と同じ「診断書」の様式で組んでいます。

  画像の作り直し方（タイトルやドメインを変えたとき）:
    tools/render-ogp.mjs を参照してください。
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper: #faf9f6;
    --surface: #ffffff;
    --ink: #141a17;
    --ink-2: #59635d;
    --ink-3: #8a938d;
    --rule: #d8dcd8;
    --rule-dark: #1d2a24;
    --seal: #0f5c43;
    --serif: "IPAexMincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --sans: "IPAGothic", "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  body {
    width: 1200px;
    height: 630px;
    background: var(--paper);
    font-family: var(--sans);
    color: var(--ink);
    display: flex;
    padding: 46px;
  }
  .sheet {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--rule);
    padding: 54px 64px;
    display: flex;
    flex-direction: column;
  }
  .brand {
    font-size: 22px;
    letter-spacing: 0.22em;
    color: var(--ink-2);
    padding-bottom: 20px;
    border-bottom: 1px solid var(--rule);
  }
  .brand span { color: var(--seal); }
  .title {
    font-family: var(--serif);
    font-size: 76px;
    line-height: 1.3;
    letter-spacing: 0.04em;
    margin-top: 38px;
  }
  .lead {
    font-size: 27px;
    line-height: 1.75;
    color: var(--ink-2);
    margin-top: 22px;
  }
  .lead b { color: var(--ink); font-weight: 500; }
  .tags { display: flex; gap: 12px; margin-top: 30px; }
  .tag {
    border: 1px solid var(--rule);
    color: var(--ink-2);
    font-size: 20px;
    letter-spacing: 0.08em;
    padding: 7px 16px;
  }
  .foot {
    margin-top: auto;
    padding-top: 22px;
    border-top: 2px solid var(--rule-dark);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 21px;
    color: var(--ink-3);
  }
  .foot .url { color: var(--seal); letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="sheet">
    <div class="brand">家 計 の 保 健 室<span>　│　</span>固定費見直し 診断書</div>
    <h1 class="title">固定費＆家計　見直し診断</h1>
    <p class="lead">
      毎月の支出を入力するだけ。<b>年間でいくら削れるか</b>と<br />
      <b>今日やるべきこと</b>が30秒でわかります。
    </p>
    <div class="tags">
      <span class="tag">完全無料</span>
      <span class="tag">登録不要</span>
      <span class="tag">データ送信なし</span>
    </div>
    <div class="foot">
      <span>30代・子育て世帯のための家計診断</span>
      <span class="url">kakei-hokenshitsu.com</span>
    </div>
  </div>
</body>
</html>
